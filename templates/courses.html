<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAPIFY | Courses</title>



    <style>
        .courses-container {
  display: flex;
  gap: 30px;
  padding: 40px;
}

.course-card {
  width: 280px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  overflow: hidden;
  transition: 0.3s ease;
}

.course-card:hover {
  transform: translateY(-8px);
}

.course-card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
}

.course-card h3 {
  padding: 15px;
  margin: 0;
}

.course-card p {
  padding: 0 15px;
  color: gray;
}

.degree-btn {
  display: block;
  margin: 15px;
  padding: 10px;
  background: #2563eb;
  color: white;
  text-align: center;
  border-radius: 8px;
  text-decoration: none;
}
    </style>

<div class="courses-container">

  <div class="course-card">
    <img src="image1.jpg" alt="Course Image">
    <h3>Master of Data Science</h3>
    <a href="#" class="degree-btn">Start Learning</a>
  </div>

  <div class="course-card">
    <img src="image2.jpg" alt="Course Image">
    <h3>Artificial Intelligence</h3>
    <a href="/ai" class="degree-btn">Start Learning</a>
  </div>

</div>


    
</head>
<body>
    
</body>
</html>
